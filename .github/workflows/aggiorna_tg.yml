name: Aggiorna TG Toscana On Demand

on:
  schedule:
    # Esegue lo script ogni giorno alle 06:00 e 13:00 UTC (8:00 e 15:00 ora italiana)
    - cron: '0 6,13 * * *'
  workflow_dispatch: # Permette l'avvio manuale quando vuoi

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esegui script
        run: python aggiorna_tg.py

      - name: Salva modifiche su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tg_toscana.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TG Toscana M3U" && git push)
